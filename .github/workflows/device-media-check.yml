name: Device media helper checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/device_media/**"
      - ".github/workflows/device-media-check.yml"
  push:
    branches:
      - quiet-1.5.0
    paths:
      - "tools/device_media/**"
      - ".github/workflows/device-media-check.yml"

permissions:
  contents: read

jobs:
  helper:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Install helper dependencies
        run: python -m pip install -r tools/device_media/requirements.txt
      - name: Check Python imports and CLI
        working-directory: tools/device_media
        run: |
          python -c "import cv2, numpy, PIL, pyvirtualcam, sounddevice, dotenv"
          python -m device_media --help
      - name: Test loopback framing
        working-directory: tools/device_media
        run: python -m unittest discover -s tests -v
